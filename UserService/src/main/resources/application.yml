spring:
  application:
    name: User-Service
  datasource:
    #url: jdbc:mysql://localhost:3306/microservices # this will not create database automatically if not exists
    url: jdbc:mysql://localhost:3306/microservices?createDatabaseIfNotExist=true # this will create database automatically if not exists
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka


